{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Importer</title>
    <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">
    <style>
        * { box-sizing: border-box; }

        :root {
            --bg: #000000;
            --surface: #161b22;
            --border: #30363d;
            --text: #fffafa;
            --shadow: #111111;
            --accent: #008cff;
            --accent-hover: #333333;
            --file-hover-bg: #262c36;
            --danger: #ef4444;
            --footer-border: #000000;
            --footer-text: #7e7d7d;
        }

        [data-theme="light"] {
            --bg: #f5f5f5;
            --surface: #ffffff;
            --border: #cccccc;
            --text: #111111;
            --shadow: #999999;
            --accent: #008cff;
            --accent-hover: #0066cc;
            --file-hover-bg: #eeeeee;
            --danger: #cc0000;
            --footer-border: #cccccc;
            --footer-text: #666666;
        }

        #theme-toggle {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
            width: 34px;
            height: 34px;
            font-size: 15px;
            cursor: pointer;
        }

        body { 
            font-family: monospace, sans-serif; 
            margin: 0; 
            padding: 30px; 
            background: var(--bg); 
            color: var(--text); 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container { 
            width: 100%;
            max-width: 500px; 
            background: var(--surface); 
            border: 2px solid var(--border); 
            padding: 25px; 
            box-shadow: 4px 4px 0px var(--shadow);
        }

        .header {
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        h1 { 
            margin: 0; 
            font-size: 22px; 
            text-transform: uppercase; 
        }

        .upload-card {
            background: var(--surface);
            border: 2px solid var(--border);
            padding: 20px;
        }

        .form-group { 
            margin-bottom: 20px; 
        }

        label {
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            display: block;
            margin-bottom: 8px;
        }

        input[type="file"] {
            width: 100%;
            padding: 18px 12px;
            border: 2px dashed var(--border);
            background: var(--surface);
            color: var(--text);
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
        }

        input[type="file"]:hover {
            background: var(--file-hover-bg);
        }

        button.btn { 
            width: 100%;
            display: inline-block; 
            background: var(--accent); 
            color: #fff; 
            padding: 12px; 
            border: 2px solid var(--shadow); 
            font-family: monospace; 
            font-weight: bold; 
            text-transform: uppercase; 
            cursor: pointer; 
        }

        button.btn:hover { 
            background: var(--accent-hover); 
        }
        .footer {
        border-top: 2px solid var(--footer-border);
        color: var(--footer-text);
        margin-top: 22px;
        padding-top: 13px;
        text-align: center;
        font-size: 12px;
        font-weight: bold;
        text-transform: uppercase;
        }
    </style>
</head>
<body>
    <script>
        (function () {
            var stored = localStorage.getItem('cascade-theme');
            var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', theme);
        })();
        function toggleTheme() {
            var current = document.documentElement.getAttribute('data-theme');
            var next = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('cascade-theme', next);
        }
    </script>
    <div class="container">
        <div class="header">
            <div style="text-align: right; padding: 10px; display: flex; align-items: center; justify-content: flex-end; gap: 10px;">
                <span>Welcome, <strong>{{ request.user.username }}</strong>!</span> | 
                <a href="{% url 'logout' %}" style="color: var(--danger); font-weight: bold;">Sign Out</a>
                <button type="button" id="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark mode">☼</button>
            </div>
            <h1>Data Importer</h1>
        </div>

        <div class="upload-card">
            {% if error %}
                <p style="color: var(--danger); font-weight: bold; margin-top: 0;">{{ error }}</p>
            {% endif %}
            <form method="post" action="{% url 'upload_csv' %}" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="form-group">
                    <label for="csv_file">Select CSV or Excel File to Analyze</label>

                    <input
                        type="file"
                        id="csv_file"
                        name="csv_file"
                        accept=".csv,.xlsx,.xls"
                        required
                    >
                </div>

                <button type="submit" class="btn">
                    Upload &amp; Clean Data
                </button>
            </form>
        </div>
        <footer class="footer">
            © 2026 Cascade. All rights reserved.
        </footer>
    </div>
</body>
</html>
