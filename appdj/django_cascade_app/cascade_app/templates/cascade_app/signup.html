{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Analytics Platform</title>
    <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Roboto:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        :root {
            /* Page background: your svg 4 saved as static/images/auth-bg.svg */
            --auth-image: url("{% static 'images/auth-bg.svg' %}");
            --primary: #38bdf8;
            --border: rgba(255, 255, 255, 0.14);
            --muted: #9aa4b2;
        }

        html { background: #05080f; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Lato', system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            color: #fff;
            -webkit-font-smoothing: antialiased;
        }

        /* the background stays put while a long form scrolls */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: var(--auth-image) center / cover no-repeat, #05080f;
        }

        .auth-shell {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .auth-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Roboto', system-ui, sans-serif;
            font-weight: 900;
            font-size: 21px;
            letter-spacing: 0.3px;
            color: #fff;
            text-decoration: none;
            text-shadow: 0 1px 14px rgba(0, 0, 0, 0.6);
        }
        .auth-brand img { width: 36px; height: 36px; border-radius: 8px; }

        .auth-card {
            width: 100%;
            background: rgba(13, 17, 23, 0.84);
            border: 1px solid var(--border);
            padding: 36px 34px;
            border-radius: 14px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
        }
        @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .auth-card {
                background: rgba(13, 17, 23, 0.68);
                -webkit-backdrop-filter: blur(14px) saturate(1.2);
                backdrop-filter: blur(14px) saturate(1.2);
            }
        }

        .auth-title {
            font-family: 'Roboto', system-ui, sans-serif;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
            color: var(--primary);
            letter-spacing: 1px;
        }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 11px 12px;
            background: rgba(5, 8, 14, 0.7);
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #fff;
            font: inherit;
            font-size: 15px;
            transition: border-color .15s, box-shadow .15s;
        }
        input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
        }

        /* form.as_p wraps every field in a <p> */
        form p { margin: 0 0 16px; }
        .helptext { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }
        ul.helptext, .helptext ul { display: none; } /* Hide verbose password help tags */

        .errorlist {
            list-style: none;
            margin: 0 0 12px;
            padding: 9px 12px;
            border-radius: 6px;
            background: rgba(240, 136, 62, 0.12);
            border: 1px solid rgba(240, 136, 62, 0.45);
            color: #ffb27a;
            font-size: 13px;
        }

        .btn {
            width: 100%;
            background: var(--primary);
            color: #0d1117;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background .15s;
        }
        .btn:hover { background: #7dd3fc; }
        .btn:focus-visible, .auth-brand:focus-visible, .auth-footer a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

        .auth-footer { text-align: center; margin-top: 20px; font-size: 14px; color: var(--muted); }
        .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 700; }
        .auth-footer a:hover { text-decoration: underline; }

        @media (max-width: 420px) {
            .auth-card { padding: 28px 22px; }
        }
    </style>
</head>
<body>
    <div class="auth-shell">
        <a href="/" class="auth-brand">
            <img src="{% static 'images/logo.png' %}" alt="">
            Cascade
        </a>
        <div class="auth-card">
            <div class="auth-title">CREATE ACCOUNT</div>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn">Sign Up</button>
            </form>
            <div class="auth-footer">
                Already have an account? <a href="{% url 'login' %}">Sign In</a>
            </div>
        </div>
    </div>
</body>
</html>
